<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Vault · 像素素材库</title>
<meta name="description" content="Pixel Vault — 开源像素艺术素材库：专业头像、游戏 UI、地贴、矢量图标。MIT 协议，自由取用。">
<link rel="icon" href="game/pixel-ui-pack/gem.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scanlines" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="./">
    <img src="game/pixel-ui-pack/heart-full.png" alt="" class="brand-heart">
    <span class="brand-name">PIXEL<em>VAULT</em></span>
    <span class="brand-sub">像素素材库</span>
  </a>
  <div class="topbar-right">
    <span class="pill pill-mit">MIT LICENSE</span>
    <a class="pill pill-gh" href="https://github.com/fanquanpp/pixel-vault" target="_blank" rel="noopener">GITHUB ↗</a>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <h1 class="hero-title">通用像素素材库</h1>
    <p class="hero-line">104+ 专业方向像素头像 · 游戏 UI 包 · 地贴 · 300+ Aseprite 源文件 · 全部 MIT</p>
    <div class="stats" id="stats"></div>
  </div>
  <div class="hero-deco" aria-hidden="true">
    <img src="game/pixel-tiles/grass.png" alt="">
    <img src="game/pixel-tiles/water.png" alt="">
    <img src="game/pixel-ui-pack/coin-gold.png" alt="">
    <img src="game/pixel-ui-pack/sword.png" alt="">
    <img src="game/pixel-ui-pack/gem.png" alt="">
    <img src="game/pixel-ui-pack/potion.png" alt="">
    <img src="game/pixel-tiles/brick.png" alt="">
  </div>
</section>

<div class="layout">
  <aside class="sidebar">
    <div class="searchbox">
      <input id="search" type="search" placeholder="搜索素材… / search" autocomplete="off">
    </div>
    <div class="filters" id="filters">
      <button class="fbtn active" data-f="all">ALL</button>
      <button class="fbtn" data-f="png">PNG</button>
      <button class="fbtn" data-f="svg">SVG</button>
      <button class="fbtn" data-f="src">有源文件</button>
    </div>
    <nav class="tree" id="tree"></nav>
    <p class="sidebar-tip">点击素材查看大图 / click an asset</p>
  </aside>

  <main class="main">
    <div class="cat-head" id="cat-head"></div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>没有匹配的素材 / no match</p>
  </main>
</div>

<footer class="footer">
  <img src="game/pixel-ui-pack/key.png" alt="" class="foot-ico">
  <span>PIXEL VAULT · © 2026 Atian (fanquanpp) · MIT License · 用 Aseprite 手作 / crafted pixel by pixel</span>
  <img src="game/pixel-ui-pack/heart-full.png" alt="" class="foot-ico">
</footer>

<div class="lightbox" id="lightbox" hidden>
  <div class="lb-backdrop" data-close></div>
  <figure class="lb-panel">
    <button class="lb-close" data-close aria-label="close">×</button>
    <div class="lb-stage checker">
      <img id="lb-img" src="" alt="">
    </div>
    <figcaption class="lb-meta">
      <div class="lb-name-row">
        <h2 id="lb-name"></h2>
        <span class="lb-badge" id="lb-badge"></span>
      </div>
      <div class="lb-tags">
        <span class="tag" id="lb-path"></span>
        <span class="tag" id="lb-dims"></span>
        <span class="tag" id="lb-size"></span>
      </div>
      <div class="lb-actions">
        <button class="abtn" id="lb-copy">⧉ 复制路径</button>
        <a class="abtn" id="lb-download" download>↓ 下载</a>
        <a class="abtn abtn-src" id="lb-src" target="_blank" rel="noopener">◆ Aseprite 源文件</a>
      </div>
      <div class="lb-nav">
        <button class="nbtn" id="lb-prev">← PREV</button>
        <button class="nbtn" id="lb-next">NEXT →</button>
      </div>
    </figcaption>
  </figure>
</div>

<script src="app.js"></script>
</body>
</html>
