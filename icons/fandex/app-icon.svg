<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- FANDEX 程序图标：字母 F -->
  <!-- 设计基准与 favicon.svg 一致：蓝色对角渐变背景 + 白色 F（favicon 32 网格路径等比放大 16 倍） -->
  <defs>
    <linearGradient id="fandex-appicon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#fandex-appicon-grad)"/>
  <!-- 字母 F 路径：白色，居中 -->
  <path d="M 144 80 L 144 432 L 208 432 L 208 288 L 352 288 L 352 224 L 208 224 L 208 144 L 384 144 L 384 80 Z" fill="#ffffff"/>
</svg>
